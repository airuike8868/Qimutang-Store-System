name: Build Qimutang 2.5.0 MySQL Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      APP_VERSION: "2.5.0"
      SOURCE_ZIP: "qimutang-2.5.0-mysql-source-clean.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Extract and locate Maven project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $work = Join-Path $env:RUNNER_TEMP "qimutang-source"
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $zip = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "*.zip" `
            -File |
            Where-Object {
              $_.Name -like "*2.5.0*" -or
              $_.Name -like "*qimutang*"
            } |
            Select-Object -First 1

          if ($zip) {
            Write-Host "Using source ZIP:"
            Write-Host $zip.FullName

            Expand-Archive `
              -Path $zip.FullName `
              -DestinationPath $work `
              -Force
          }
          else {
            Write-Host "No source ZIP found. Using checked-out repository."
            $work = $env:GITHUB_WORKSPACE
          }

          $pom = Get-ChildItem `
            -Path $work `
            -Filter "pom.xml" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $pom) {
            throw "pom.xml not found"
          }

          $projectDir = $pom.Directory.FullName

          Write-Host "Maven project:"
          Write-Host $projectDir

          "PROJECT_DIR=$projectDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Patch Java compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $javaFiles = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter "*.java" `
            -Recurse `
            -File

          foreach ($file in $javaFiles) {

            $text = [System.IO.File]::ReadAllText($file.FullName)

            if ($text.Length -gt 0 -and $text[0] -eq [char]0xFEFF) {
              $text = $text.Substring(1)
            }

            $text = $text -replace `
              '\.execute\(\s*connection\s*->', `
              '.execute((org.springframework.jdbc.core.ConnectionCallback<Object>) connection ->'

            $text = $text -replace `
              '\.execute\(\s*conn\s*->', `
              '.execute((org.springframework.jdbc.core.ConnectionCallback<Object>) conn ->'

            $utf8 = New-Object System.Text.UTF8Encoding($false)

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8
            )
          }

      - name: Build Qimutang 2.5.0
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          mvn -B -DskipTests clean package

          if ($LASTEXITCODE -ne 0) {
            throw "Maven build failed"
          }

      - name: Verify MySQL Connector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          mvn dependency:tree `
            "-Dincludes=com.mysql:mysql-connector-j"

          Write-Host "MySQL Connector verification completed."

      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup -y --no-progress

          $possible = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )

          $iscc = $possible |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $iscc) {
            throw "ISCC.exe not found"
          }

          "ISCC=$iscc" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Prepare Windows payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:RUNNER_TEMP "qimutang-stage"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $stage |
            Out-Null

          $jar = Get-ChildItem `
            -Path (Join-Path $env:PROJECT_DIR "target") `
            -Filter "*.jar" `
            -File |
            Where-Object {
              $_.Name -notlike "*sources*" -and
              $_.Name -notlike "*javadoc*" -and
              $_.Name -notlike "*.original"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $jar) {
            throw "Application JAR not found"
          }

          Copy-Item `
            -Path $jar.FullName `
            -Destination (Join-Path $stage "qimutang.jar") `
            -Force

          $javaHome = $env:JAVA_HOME

          if (-not $javaHome) {
            throw "JAVA_HOME is empty"
          }

          $runtime = Join-Path $stage "runtime"

          & "$javaHome\bin\jlink.exe" `
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.sql,java.transaction.xa,jdk.crypto.ec,jdk.unsupported `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --output "$runtime"

          if ($LASTEXITCODE -ne 0) {
            throw "jlink failed"
          }

          $launcher = @'
          @echo off
          setlocal
          cd /d "%~dp0"

          if not exist "%~dp0runtime\bin\javaw.exe" (
              echo Java runtime not found.
              pause
              exit /b 1
          )

          start "" "%~dp0runtime\bin\javaw.exe" -jar "%~dp0qimutang.jar"

          endlocal
          '@

          $launcherPath = Join-Path $stage "start-qimutang.cmd"

          [System.IO.File]::WriteAllText(
            $launcherPath,
            $launcher,
            [System.Text.Encoding]::ASCII
          )

          "STAGE_DIR=$stage" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Windows payload prepared:"
          Get-ChildItem $stage

      - name: Generate installer script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iss = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang.iss"

          $stage = $env:STAGE_DIR

          $content = @"
          [Setup]
          AppId=QimutangStoreSystem250
          AppName=齐沐堂门店管理系统
          AppVersion=$env:APP_VERSION
          AppPublisher=齐沐堂
          DefaultDirName={localappdata}\QimutangStoreSystem
          DefaultGroupName=齐沐堂门店管理系统
          DisableProgramGroupPage=yes
          OutputDir=$env:RUNNER_TEMP
          OutputBaseFilename=Qimutang-2.5.0-Windows-Installer
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          WizardStyle=modern
          UninstallDisplayName=齐沐堂门店管理系统

          [Languages]
          Name: "chinesesimp"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"

          [Files]
          Source: "$stage\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"
          Name: "{userdesktop}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\start-qimutang.cmd"; Description: "启动齐沐堂门店管理系统"; Flags: nowait postinstall skipifsilent
          "@

          $utf8WithBom = New-Object System.Text.UTF8Encoding($true)

          [System.IO.File]::WriteAllText(
            $iss,
            $content,
            $utf8WithBom
          )

          Write-Host "Generated installer script:"
          Get-Content $iss

          "ISS_FILE=$iss" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build EXE installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          & "$env:ISCC" "$env:ISS_FILE"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

      - name: Verify installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "Qimutang-2.5.0-Windows-Installer.exe"

          if (-not (Test-Path $installer)) {
            throw "Installer EXE not found"
          }

          $size = (Get-Item $installer).Length

          if ($size -lt 1000000) {
            throw "Installer EXE is unexpectedly small"
          }

          Write-Host "Installer OK:"
          Write-Host $installer
          Write-Host "Size: $size bytes"

          "INSTALLER_PATH=$installer" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Qimutang-2.5.0-Windows-Installer
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 30
