name: Build Qimutang 2.5.0 MySQL Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MYSQL_VERSION: "8.4.11"
      SOURCE_ZIP: "qimutang-2.5.0-mysql-source-clean.zip"
      APP_VERSION: "2.5.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Extract 2.5.0 source
        shell: powershell
        run: |
          if (!(Test-Path $env:SOURCE_ZIP)) { throw "Missing $env:SOURCE_ZIP in repository root" }
          if (Test-Path source) { Remove-Item source -Recurse -Force }
          Expand-Archive -Path $env:SOURCE_ZIP -DestinationPath source -Force
          $project = Get-ChildItem source -Filter pom.xml -Recurse | Select-Object -First 1
          if (!$project) { throw "pom.xml not found after extraction" }
          "PROJECT_DIR=$($project.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build real 2.5.0 JAR
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          mvn --batch-mode clean package -DskipTests
          if (!(Test-Path "target\qimutang.jar")) { throw "target/qimutang.jar was not generated" }

      - name: Verify version and MySQL Connector/J
        shell: powershell
        run: |
          Set-Location $env:PROJECT_DIR
          $pom = Get-Content pom.xml -Raw
          if ($pom -notmatch '<version>2\.5\.0</version>') { throw "pom.xml is not 2.5.0" }
          $entries = & jar tf target\qimutang.jar
          if (-not ($entries | Select-String 'BOOT-INF/lib/mysql-connector-j-.*\.jar')) {
            throw "MySQL Connector/J is missing from executable JAR"
          }
          Write-Host "[OK] Real 2.5.0 JAR contains MySQL Connector/J"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare self-contained payload
        shell: powershell
        run: |
          $project = $env:PROJECT_DIR
          $stage = Join-Path $env:RUNNER_TEMP 'qimutang-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stage\app", "$stage\runtime", "$stage\scripts", "$stage\packaging" | Out-Null

          Copy-Item "$project\target\qimutang.jar" "$stage\app\qimutang.jar" -Force
          Copy-Item "$project\scripts\*" "$stage\scripts" -Recurse -Force
          Copy-Item "$project\start-qimutang.cmd" "$stage\start-qimutang.cmd" -Force
          Copy-Item "$project\packaging\qimutang.ico" "$stage\qimutang.ico" -Force
          if (Test-Path "$project\Windows使用说明.txt") { Copy-Item "$project\Windows使用说明.txt" "$stage\Windows使用说明.txt" -Force }

          # Bundle the Java 17 runtime already provided by setup-java.
          Copy-Item "$env:JAVA_HOME\*" "$stage\runtime" -Recurse -Force

          # Bundle official MySQL Community Server 8.4 LTS ZIP.
          $mysqlZip = Join-Path $env:RUNNER_TEMP "mysql-$env:MYSQL_VERSION-winx64.zip"
          $mysqlUrl = "https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-$env:MYSQL_VERSION-winx64.zip"
          Invoke-WebRequest -Uri $mysqlUrl -OutFile $mysqlZip -UseBasicParsing
          $mysqlExtract = Join-Path $env:RUNNER_TEMP 'mysql-extract'
          if (Test-Path $mysqlExtract) { Remove-Item $mysqlExtract -Recurse -Force }
          Expand-Archive -Path $mysqlZip -DestinationPath $mysqlExtract -Force
          $mysqlRoot = Get-ChildItem $mysqlExtract -Directory | Select-Object -First 1
          if (!$mysqlRoot -or !(Test-Path "$($mysqlRoot.FullName)\bin\mysqld.exe")) { throw "MySQL ZIP layout is unexpected" }
          Copy-Item $mysqlRoot.FullName "$stage\mysql" -Recurse -Force

          # VC++ runtime used by MySQL on Windows.
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile "$stage\vc_redist.x64.exe" -UseBasicParsing

          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate Inno Setup script
        shell: powershell
        run: |
          $iss = Join-Path $env:RUNNER_TEMP 'qimutang.iss'
          $stage = $env:STAGE_DIR -replace '\\','\\'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $content = @"
          [Setup]
          AppId={{E7A30D65-8F42-4B43-98D6-2500QMT25000}
          AppName=齐沐堂门店管理系统
          AppVersion=$env:APP_VERSION
          AppPublisher=齐沐堂
          DefaultDirName={localappdata}\Programs\QimutangStore
          DefaultGroupName=齐沐堂
          OutputDir=$output
          OutputBaseFilename=齐沐堂门店管理系统-$env:APP_VERSION-MySQL-Windows安装版
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          SetupIconFile=$stage\qimutang.ico
          UninstallDisplayIcon={app}\qimutang.ico
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no

          [Files]
          Source: "$stage\app\*"; DestDir: "{app}\app"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\runtime\*"; DestDir: "{app}\runtime"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\mysql\*"; DestDir: "{app}\mysql"; Flags: ignoreversion recursesubdirs createallsubdirs restartreplace
          Source: "$stage\scripts\*"; DestDir: "{app}\scripts"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\start-qimutang.cmd"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$stage\qimutang.ico"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$stage\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Dirs]
          Name: "{userprofile}\QimutangData"
          Name: "{userprofile}\QimutangData\config"
          Name: "{userprofile}\QimutangData\data"
          Name: "{userprofile}\QimutangData\logs"
          Name: "{userprofile}\QimutangData\backup"

          [Icons]
          Name: "{autodesktop}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"; IconFilename: "{app}\qimutang.ico"
          Name: "{group}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"; IconFilename: "{app}\qimutang.ico"

          [Run]
          Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; StatusMsg: "正在安装 MySQL 所需运行组件..."; Flags: waituntilterminated
          Filename: "{app}\start-qimutang.cmd"; Description: "启动齐沐堂门店管理系统"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -LiteralPath $iss -Value $content -Encoding UTF8
          "ISS_PATH=$iss" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build one-click EXE installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc $env:ISS_PATH
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }

      - name: Verify generated installer
        shell: powershell
        run: |
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (!$exe) { throw "Installer EXE was not generated" }
          if ($exe.Length -lt 100MB) { Write-Warning "Installer is unexpectedly small: $($exe.Length) bytes" }
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($exe.Name)" | Set-Content 'dist\SHA256SUMS.txt' -Encoding ASCII
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Qimutang-2.5.0-MySQL-Windows-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
