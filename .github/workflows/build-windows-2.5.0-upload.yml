name: Build Qimutang 2.5.0 MySQL Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      APP_VERSION: "2.5.0"
      MYSQL_VERSION: "8.4.11"
      SOURCE_ZIP: "齐沐堂2.5.0-GitHub构建上传包.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract and locate Maven project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path -LiteralPath $env:SOURCE_ZIP)) {
            Write-Host "Repository files:"
            Get-ChildItem -Force | Format-Table Name,Length
            throw "Source ZIP not found: $env:SOURCE_ZIP"
          }

          $work = Join-Path $env:RUNNER_TEMP "qimutang-source"

          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $work | Out-Null

          Expand-Archive `
            -LiteralPath $env:SOURCE_ZIP `
            -DestinationPath $work `
            -Force

          for ($round = 1; $round -le 5; $round++) {

            $pom = Get-ChildItem `
              -Path $work `
              -Filter pom.xml `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($pom) {
              break
            }

            $nestedZips = Get-ChildItem `
              -Path $work `
              -Filter *.zip `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if (!$nestedZips) {
              break
            }

            foreach ($zip in $nestedZips) {

              $dest = Join-Path `
                $zip.Directory.FullName `
                ("expanded-" + $zip.BaseName)

              if (!(Test-Path $dest)) {

                New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path $dest |
                  Out-Null

                try {
                  Expand-Archive `
                    -LiteralPath $zip.FullName `
                    -DestinationPath $dest `
                    -Force
                }
                catch {
                  Write-Warning "Cannot extract: $($zip.FullName)"
                }
              }
            }
          }

          $pom = Get-ChildItem `
            -Path $work `
            -Filter pom.xml `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$pom) {
            throw "pom.xml not found inside source ZIP"
          }

          $projectDir = $pom.Directory.FullName

          Write-Host "PROJECT:"
          Write-Host $projectDir

          "PROJECT_DIR=$projectDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Patch Java compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          function Read-Java([string]$path) {

            $text = [System.IO.File]::ReadAllText($path)

            if (
              $text.Length -gt 0 -and
              [int][char]$text[0] -eq 0xFEFF
            ) {
              $text = $text.Substring(1)
            }

            return $text
          }

          function Add-CallbackImport([string]$text) {

            if (
              $text -notmatch
              'import org\.springframework\.jdbc\.core\.ConnectionCallback;'
            ) {

              if (
                $text -match
                'import org\.springframework\.jdbc\.core\.JdbcTemplate;'
              ) {

                $text = $text -replace `
                  'import org\.springframework\.jdbc\.core\.JdbcTemplate;', `
                  "import org.springframework.jdbc.core.JdbcTemplate;`r`nimport org.springframework.jdbc.core.ConnectionCallback;"

              }
              else {

                $text = $text -replace `
                  '(package\s+[^;]+;)', `
                  "`$1`r`n`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
              }
            }

            return $text
          }

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter DbCompat.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {

            $text = Read-Java $file.FullName
            $text = Add-CallbackImport $text

            $text = $text -replace `
              'db\.execute\(\s*connection\s*->', `
              'db.execute((ConnectionCallback<Boolean>) connection ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )

            Write-Host "Patched DbCompat"
          }

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter SqliteToMysqlMigrationService.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {

            $text = Read-Java $file.FullName
            $text = Add-CallbackImport $text

            $text = $text -replace `
              'Boolean\s+result\s*=\s*target\.execute\(\s*connection\s*->', `
              'Boolean result = target.execute((ConnectionCallback<Boolean>) connection ->'

            $text = $text -replace `
              '(?m)^(\s*)target\.execute\(\s*connection\s*->', `
              '$1target.execute((ConnectionCallback<Void>) connection ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )

            Write-Host "Patched migration service"
          }

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter MySqlReadinessService.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {

            $text = Read-Java $file.FullName
            $text = Add-CallbackImport $text

            $text = $text -replace `
              'Map<String,Object>\s+meta\s*=\s*db\.execute\(\s*c\s*->', `
              'Map<String,Object> meta = db.execute((ConnectionCallback<Map<String,Object>>) c ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )

            Write-Host "Patched readiness service"
          }

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter MySqlLogicalBackup.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {

            $text = Read-Java $file.FullName
            $text = Add-CallbackImport $text

            $text = $text -replace `
              'db\.execute\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*->', `
              'db.execute((ConnectionCallback<Void>) $1 ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )

            Write-Host "Patched logical backup"
          }

          Write-Host "JAVA PATCH COMPLETE"

      - name: Build Qimutang 2.5.0
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          mvn `
            --batch-mode `
            clean `
            package `
            -DskipTests

          if ($LASTEXITCODE -ne 0) {
            throw "Maven build failed"
          }

          Write-Host "Generated JAR files:"

          Get-ChildItem `
            target `
            -Filter *.jar `
            -File |
            Format-Table Name,Length

          $jar = Get-ChildItem `
            target `
            -Filter *.jar `
            -File |
            Where-Object {
              $_.Name -notlike "original-*"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (!$jar) {
            throw "No JAR generated"
          }

          $targetJar = Join-Path `
            $env:PROJECT_DIR `
            "target\qimutang.jar"

          $sourceFull = [System.IO.Path]::GetFullPath($jar.FullName)
          $targetFull = [System.IO.Path]::GetFullPath($targetJar)

          if ($sourceFull -ne $targetFull) {

            Copy-Item `
              -LiteralPath $sourceFull `
              -Destination $targetFull `
              -Force

            Write-Host "JAR renamed to qimutang.jar"
          }
          else {

            Write-Host "qimutang.jar already correct"
          }

          if (!(Test-Path $targetFull)) {
            throw "qimutang.jar missing"
          }

          Write-Host "JAR BUILD SUCCESS"

      - name: Verify MySQL Connector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          $entries = & jar tf "target\qimutang.jar"

          $mysql = $entries |
            Select-String -Pattern "mysql-connector"

          if ($mysql) {
            Write-Host "MYSQL CONNECTOR FOUND"
            $mysql
          }
          else {
            Write-Warning "Connector filename not visible in JAR"
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup --no-progress -y

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      - name: Prepare Windows payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang-stage"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path `
              "$stage\app",
              "$stage\runtime",
              "$stage\mysql",
              "$stage\data",
              "$stage\logs" |
            Out-Null

          Copy-Item `
            "$env:PROJECT_DIR\target\qimutang.jar" `
            "$stage\app\qimutang.jar" `
            -Force

          Copy-Item `
            "$env:JAVA_HOME\*" `
            "$stage\runtime" `
            -Recurse `
            -Force

          $cmd = @'
          @echo off
          setlocal
          cd /d "%~dp0"
          start "" "%~dp0runtime\bin\javaw.exe" -jar "%~dp0app\qimutang.jar"
          exit
          '@

          [System.IO.File]::WriteAllText(
            "$stage\start-qimutang.cmd",
            $cmd,
            [System.Text.Encoding]::ASCII
          )

          $mysqlZip = Join-Path `
            $env:RUNNER_TEMP `
            "mysql-$env:MYSQL_VERSION-winx64.zip"

          $mysqlUrl = `
            "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-$env:MYSQL_VERSION-winx64.zip"

          Write-Host "Downloading MySQL:"
          Write-Host $mysqlUrl

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            -o $mysqlZip `
            $mysqlUrl

          if ($LASTEXITCODE -ne 0) {
            throw "MySQL download failed"
          }

          if (!(Test-Path $mysqlZip)) {
            throw "MySQL ZIP missing"
          }

          $mysqlSize = (Get-Item $mysqlZip).Length

          Write-Host "MySQL ZIP size: $mysqlSize"

          if ($mysqlSize -lt 200MB) {
            throw "MySQL ZIP invalid or incomplete"
          }

          $mysqlExtract = Join-Path `
            $env:RUNNER_TEMP `
            "mysql-extracted"

          if (Test-Path $mysqlExtract) {
            Remove-Item $mysqlExtract -Recurse -Force
          }

          Expand-Archive `
            -LiteralPath $mysqlZip `
            -DestinationPath $mysqlExtract `
            -Force

          $mysqlRoot = Get-ChildItem `
            $mysqlExtract `
            -Directory |
            Where-Object {
              Test-Path (Join-Path $_.FullName "bin\mysqld.exe")
            } |
            Select-Object -First 1

          if (!$mysqlRoot) {
            throw "MySQL extracted directory missing"
          }

          Copy-Item `
            "$($mysqlRoot.FullName)\*" `
            "$stage\mysql" `
            -Recurse `
            -Force

          if (!(Test-Path "$stage\mysql\bin\mysqld.exe")) {
            throw "mysqld.exe missing"
          }

          Write-Host "WINDOWS PAYLOAD READY"

          "STAGE_DIR=$stage" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Generate installer script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iss = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang.iss"

          $stage = $env:STAGE_DIR

          $content = @"
          [Setup]
          AppId=QimutangStoreSystem250
          AppName=齐沐堂门店管理系统
          AppVersion=$env:APP_VERSION
          AppPublisher=齐沐堂
          DefaultDirName={localappdata}\QimutangStoreSystem
          DefaultGroupName=齐沐堂门店管理系统
          DisableProgramGroupPage=yes
          OutputDir=$env:RUNNER_TEMP
          OutputBaseFilename=Qimutang-2.5.0-Windows-Installer
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          WizardStyle=modern
          UninstallDisplayName=齐沐堂门店管理系统

          [Files]
          Source: "$stage\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"
          Name: "{userdesktop}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\start-qimutang.cmd"; Description: "启动齐沐堂门店管理系统"; Flags: nowait postinstall skipifsilent
          "@

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllText(
            $iss,
            $content,
            $utf8NoBom
          )

          Write-Host "Generated installer script:"
          Get-Content $iss

          "ISS_FILE=$iss" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build EXE installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $iscc)) {
            throw "ISCC.exe not found"
          }

          & $iscc $env:ISS_FILE

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

      - name: Verify installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "Qimutang-2.5.0-Windows-Installer.exe"

          if (!(Test-Path $installer)) {
            throw "Installer EXE missing"
          }

          $size = (Get-Item $installer).Length

          Write-Host "INSTALLER:"
          Write-Host $installer

          Write-Host "SIZE:"
          Write-Host $size

          if ($size -lt 1000000) {
            throw "Installer EXE unexpectedly small"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Qimutang-2.5.0-Windows-Installer
          path: ${{ runner.temp }}/Qimutang-2.5.0-Windows-Installer.exe
          if-no-files-found: error
          retention-days: 30
