name: Build Qimutang 2.5.0 MySQL Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      APP_VERSION: "2.5.0"
      MYSQL_VERSION: "8.4.11"
      SOURCE_ZIP: "齐沐堂2.5.0-GitHub构建上传包.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract and locate Maven project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path -LiteralPath $env:SOURCE_ZIP)) {
            Write-Host "Repository root files:"
            Get-ChildItem -Force | Format-Table Name, Length
            throw "Source ZIP not found: $env:SOURCE_ZIP"
          }

          $work = Join-Path $env:RUNNER_TEMP "qimutang-source"

          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $work | Out-Null

          Expand-Archive `
            -LiteralPath $env:SOURCE_ZIP `
            -DestinationPath $work `
            -Force

          for ($round = 1; $round -le 4; $round++) {
            $pom = Get-ChildItem `
              -Path $work `
              -Filter pom.xml `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($pom) {
              break
            }

            $nestedZips = Get-ChildItem `
              -Path $work `
              -Filter *.zip `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if (!$nestedZips) {
              break
            }

            foreach ($zip in $nestedZips) {
              $dest = Join-Path `
                $zip.Directory.FullName `
                ("expanded-" + $zip.BaseName)

              if (!(Test-Path $dest)) {
                New-Item -ItemType Directory -Force -Path $dest | Out-Null

                try {
                  Expand-Archive `
                    -LiteralPath $zip.FullName `
                    -DestinationPath $dest `
                    -Force
                }
                catch {
                  Write-Warning "Cannot extract nested ZIP: $($zip.FullName)"
                }
              }
            }
          }

          $pom = Get-ChildItem `
            -Path $work `
            -Filter pom.xml `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$pom) {
            throw "pom.xml not found anywhere inside source package"
          }

          $projectDir = $pom.Directory.FullName

          Write-Host "Maven project found:"
          Write-Host $projectDir

          "PROJECT_DIR=$projectDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Patch Spring JdbcTemplate execute overloads
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Ensure-ConnectionCallbackImport([string]$file) {
            $text = [System.IO.File]::ReadAllText($file)

            if ($text -notmatch 'import org\.springframework\.jdbc\.core\.ConnectionCallback;') {
              if ($text -match 'import org\.springframework\.jdbc\.core\.JdbcTemplate;') {
                $text = $text -replace `
                  'import org\.springframework\.jdbc\.core\.JdbcTemplate;', `
                  "import org.springframework.jdbc.core.JdbcTemplate;`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
              }
              else {
                $text = $text -replace `
                  '(package\s+[^;]+;)', `
                  "`$1`r`n`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
              }
            }

            return $text
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter DbCompat.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {
            $text = Ensure-ConnectionCallbackImport $file.FullName

            if (
              $text.Length -gt 0 -and
              [int][char]$text[0] -eq 0xFEFF
            ) {
              $text = $text.Substring(1)
            }

            $text = $text -replace `
              'db\.execute\(connection\s*->', `
              'db.execute((ConnectionCallback<Boolean>) connection ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )
          }

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter SqliteToMysqlMigrationService.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {
            $text = Ensure-ConnectionCallbackImport $file.FullName

            if (
              $text.Length -gt 0 -and
              [int][char]$text[0] -eq 0xFEFF
            ) {
              $text = $text.Substring(1)
            }

            $text = $text -replace `
              'Boolean\s+result\s*=\s*target\.execute\(connection\s*->', `
              'Boolean result = target.execute((ConnectionCallback<Boolean>) connection ->'

            $text = $text -replace `
              '(?m)^\s*target\.execute\(connection\s*->', `
              '        target.execute((ConnectionCallback<Void>) connection ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )
          }

          $file = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter MySqlReadinessService.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($file) {
            $text = Ensure-ConnectionCallbackImport $file.FullName

            $text = $text -replace `
              'Map<String,Object>\s+meta\s*=\s*db\.execute\(c\s*->', `
              'Map<String,Object> meta = db.execute((ConnectionCallback<Map<String,Object>>) c ->'

            [System.IO.File]::WriteAllText(
              $file.FullName,
              $text,
              $utf8NoBom
            )
          }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Qimutang 2.5.0
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          mvn --batch-mode clean package -DskipTests

          if ($LASTEXITCODE -ne 0) {
            throw "Maven build failed"
          }

          $jar = Get-ChildItem `
            target `
            -Filter *.jar `
            -File |
            Where-Object {
              $_.Name -notlike "original-*"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (!$jar) {
            throw "No JAR generated"
          }

          if ($jar.Name -ne "qimutang.jar") {
            Copy-Item `
              $jar.FullName `
              "target\qimutang.jar" `
              -Force
          }

          if (!(Test-Path "target\qimutang.jar")) {
            throw "qimutang.jar missing"
          }

          Write-Host "JAR BUILD OK"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      - name: Prepare Windows payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang-stage"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path `
              "$stage\app",
              "$stage\runtime",
              "$stage\scripts" |
            Out-Null

          Copy-Item `
            "$env:PROJECT_DIR\target\qimutang.jar" `
            "$stage\app\qimutang.jar" `
            -Force

          Copy-Item `
            "$env:JAVA_HOME\*" `
            "$stage\runtime" `
            -Recurse `
            -Force

          $startFile = Join-Path `
            $env:PROJECT_DIR `
            "start-qimutang.cmd"

          if (Test-Path $startFile) {
            Copy-Item `
              $startFile `
              "$stage\start-qimutang.cmd" `
              -Force
          }
          else {
            @'
          @echo off
          setlocal
          cd /d "%~dp0"
          "%~dp0runtime\bin\java.exe" -jar "%~dp0app\qimutang.jar"
          '@ |
            Set-Content `
              "$stage\start-qimutang.cmd" `
              -Encoding ASCII
          }

          $scripts = Join-Path `
            $env:PROJECT_DIR `
            "scripts"

          if (Test-Path $scripts) {
            Copy-Item `
              "$scripts\*" `
              "$stage\scripts" `
              -Recurse `
              -Force
          }

          $mysqlZip = Join-Path `
            $env:RUNNER_TEMP `
            "mysql-$env:MYSQL_VERSION-winx64.zip"

          $mysqlUrl = `
            "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-$env:MYSQL_VERSION-winx64.zip"

          Write-Host "Downloading MySQL:"
          Write-Host $mysqlUrl

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            -o $mysqlZip `
            $mysqlUrl

          if ($LASTEXITCODE -ne 0) {
            throw "MySQL download failed"
          }

          if (!(Test-Path $mysqlZip)) {
            throw "MySQL ZIP missing"
          }

          $mysqlSize = (Get-Item $mysqlZip).Length

          Write-Host "MySQL ZIP size:"
          Write-Host $mysqlSize

          if ($mysqlSize -lt 200MB) {
            throw "MySQL ZIP invalid or incomplete"
          }

          $mysqlExtract = Join-Path `
            $env:RUNNER_TEMP `
            "mysql-extracted"

          if (Test-Path $mysqlExtract) {
            Remove-Item `
              $mysqlExtract `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -LiteralPath $mysqlZip `
            -DestinationPath $mysqlExtract `
            -Force

          $mysqlRoot = Get-ChildItem `
            $mysqlExtract `
            -Directory |
            Where-Object {
              Test-Path `
                (Join-Path $_.FullName "bin\mysqld.exe")
            } |
            Select-Object -First 1

          if (!$mysqlRoot) {
            throw "mysqld.exe not found after extraction"
          }

          Copy-Item `
            $mysqlRoot.FullName `
            "$stage\mysql" `
            -Recurse `
            -Force

          $vcFile = "$stage\vc_redist.x64.exe"

          Write-Host "Downloading VC++ Runtime"

          & curl.exe `
            -L `
            --fail `
            --retry 5 `
            --retry-delay 3 `
            --connect-timeout 30 `
            -o $vcFile `
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "VC++ Runtime download failed"
          }

          if (!(Test-Path $vcFile)) {
            throw "VC++ Runtime file missing"
          }

          if ((Get-Item $vcFile).Length -lt 5MB) {
            throw "VC++ Runtime download invalid"
          }

          Write-Host "WINDOWS PAYLOAD READY"

          "STAGE_DIR=$stage" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Generate installer script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iss = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang.iss"

          $output = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $output |
            Out-Null

          $stage = $env:STAGE_DIR

          $content = @"
          [Setup]
          AppId={{E7A30D65-8F42-4B43-98D6-250025025000}
          AppName=齐沐堂门店管理系统
          AppVersion=$env:APP_VERSION
          AppPublisher=齐沐堂
          DefaultDirName={localappdata}\Programs\QimutangStore
          DefaultGroupName=齐沐堂
          OutputDir=$output
          OutputBaseFilename=齐沐堂门店管理系统-$env:APP_VERSION-Windows安装版
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          CloseApplications=yes

          [Files]
          Source: "$stage\app\*"; DestDir: "{app}\app"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\runtime\*"; DestDir: "{app}\runtime"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\mysql\*"; DestDir: "{app}\mysql"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\scripts\*"; DestDir: "{app}\scripts"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\start-qimutang.cmd"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$stage\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Dirs]
          Name: "{userprofile}\QimutangData"
          Name: "{userprofile}\QimutangData\config"
          Name: "{userprofile}\QimutangData\data"
          Name: "{userprofile}\QimutangData\logs"
          Name: "{userprofile}\QimutangData\backup"

          [Icons]
          Name: "{autodesktop}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"
          Name: "{group}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"

          [Run]
          Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; Flags: waituntilterminated
          Filename: "{app}\start-qimutang.cmd"; Description: "启动齐沐堂门店管理系统"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          "@

          Set-Content `
            -LiteralPath $iss `
            -Value $content `
            -Encoding UTF8

          "ISS_PATH=$iss" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build EXE installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = `
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            $iscc = `
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }

          & $iscc $env:ISS_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

      - name: Verify installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem `
            dist `
            -Filter *.exe `
            -File |
            Select-Object -First 1

          if (!$exe) {
            throw "Installer EXE was not generated"
          }

          $hash = Get-FileHash `
            $exe.FullName `
            -Algorithm SHA256

          "$($hash.Hash.ToLower())  $($exe.Name)" |
            Set-Content `
              "dist\SHA256SUMS.txt" `
              -Encoding ASCII

          Write-Host "INSTALLER GENERATED"
          Write-Host $exe.FullName
          Write-Host $exe.Length
          Write-Host $hash.Hash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Qimutang-2.5.0-Windows-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
