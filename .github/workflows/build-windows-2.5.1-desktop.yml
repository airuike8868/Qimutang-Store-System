name: Build Qimutang 2.5.1 Windows Desktop Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 75

    env:
      APP_VERSION: "2.5.1"
      MYSQL_VERSION: "8.4.11"
      SOURCE_ZIP: "qimutang-2.5.1-desktop-source.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Extract source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sourceZip = Join-Path $env:GITHUB_WORKSPACE $env:SOURCE_ZIP
          if (!(Test-Path -LiteralPath $sourceZip)) {
            throw "Missing source ZIP: $env:SOURCE_ZIP"
          }
          $work = Join-Path $env:RUNNER_TEMP "qimutang-251-source"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $work -Force
          $pom = Get-ChildItem -Path $work -Filter pom.xml -File -Recurse | Select-Object -First 1
          if (!$pom) { throw "pom.xml not found" }
          $projectDir = $pom.Directory.FullName
          "PROJECT_DIR=$projectDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project: $projectDir"

      - name: Patch Java 17 compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          function Ensure-Import([string]$file) {
            $text = [System.IO.File]::ReadAllText($file)
            if ($text.Length -gt 0 -and [int][char]$text[0] -eq 0xFEFF) { $text = $text.Substring(1) }
            if ($text -notmatch 'import org\.springframework\.jdbc\.core\.ConnectionCallback;') {
              if ($text -match 'import org\.springframework\.jdbc\.core\.JdbcTemplate;') {
                $text = $text -replace 'import org\.springframework\.jdbc\.core\.JdbcTemplate;', "import org.springframework.jdbc.core.JdbcTemplate;`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
              } else {
                $text = $text -replace '(package\s+[^;]+;)', "`$1`r`n`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
              }
            }
            return $text
          }

          $file = Get-ChildItem $env:PROJECT_DIR -Filter DbCompat.java -File -Recurse | Select-Object -First 1
          if ($file) {
            $text = Ensure-Import $file.FullName
            $text = $text -replace 'db\.execute\(\s*connection\s*->', 'db.execute((ConnectionCallback<Boolean>) connection ->'
            [System.IO.File]::WriteAllText($file.FullName,$text,$utf8NoBom)
          }

          $file = Get-ChildItem $env:PROJECT_DIR -Filter SqliteToMysqlMigrationService.java -File -Recurse | Select-Object -First 1
          if ($file) {
            $text = Ensure-Import $file.FullName
            $text = $text -replace 'Boolean\s+result\s*=\s*target\.execute\(\s*connection\s*->', 'Boolean result = target.execute((ConnectionCallback<Boolean>) connection ->'
            $text = $text -replace '(?m)^(\s*)target\.execute\(\s*connection\s*->', '$1target.execute((ConnectionCallback<Void>) connection ->'
            [System.IO.File]::WriteAllText($file.FullName,$text,$utf8NoBom)
          }

          $file = Get-ChildItem $env:PROJECT_DIR -Filter MySqlReadinessService.java -File -Recurse | Select-Object -First 1
          if ($file) {
            $text = Ensure-Import $file.FullName
            $text = $text -replace 'Map<String,Object>\s+meta\s*=\s*db\.execute\(\s*c\s*->', 'Map<String,Object> meta = db.execute((ConnectionCallback<Map<String,Object>>) c ->'
            [System.IO.File]::WriteAllText($file.FullName,$text,$utf8NoBom)
          }

          $file = Get-ChildItem $env:PROJECT_DIR -Filter MySqlLogicalBackup.java -File -Recurse | Select-Object -First 1
          if ($file) {
            $text = Ensure-Import $file.FullName
            $text = $text -replace 'db\.execute\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*->', 'db.execute((ConnectionCallback<Void>) $1 ->'
            [System.IO.File]::WriteAllText($file.FullName,$text,$utf8NoBom)
          }

      - name: Build Java backend
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:PROJECT_DIR
          mvn --batch-mode clean package -DskipTests
          if ($LASTEXITCODE -ne 0) { throw "Maven build failed" }
          $jar = Get-ChildItem target -Filter '*.jar' -File | Where-Object { $_.Name -notlike 'original-*' } | Sort-Object Length -Descending | Select-Object -First 1
          if (!$jar) { throw "No application JAR generated" }
          $targetJar = Join-Path $env:PROJECT_DIR 'target\qimutang.jar'
          if (![string]::Equals([System.IO.Path]::GetFullPath($jar.FullName),[System.IO.Path]::GetFullPath($targetJar),[System.StringComparison]::OrdinalIgnoreCase)) {
            Copy-Item $jar.FullName $targetJar -Force
          }

      - name: Build Windows desktop client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $client = Join-Path $env:PROJECT_DIR 'desktop-client\QimutangDesktop.csproj'
          if (!(Test-Path $client)) { throw "Desktop client project missing" }
          $publish = Join-Path $env:RUNNER_TEMP 'qimutang-desktop-publish'
          dotnet restore $client
          dotnet publish $client -c Release -r win-x64 --self-contained true -o $publish --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Desktop client build failed" }
          if (!(Test-Path (Join-Path $publish 'QimutangDesktop.exe'))) { throw "QimutangDesktop.exe missing" }
          "CLIENT_PUBLISH=$publish" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }

      - name: Prepare desktop payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP 'qimutang-251-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$stage\app","$stage\runtime","$stage\client","$stage\mysql" | Out-Null

          Copy-Item "$env:PROJECT_DIR\target\qimutang.jar" "$stage\app\qimutang.jar" -Force
          Copy-Item "$env:JAVA_HOME\*" "$stage\runtime" -Recurse -Force
          Copy-Item "$env:CLIENT_PUBLISH\*" "$stage\client" -Recurse -Force
          Copy-Item "$env:PROJECT_DIR\packaging\qimutang.ico" "$stage\qimutang.ico" -Force

          $mysqlZip = Join-Path $env:RUNNER_TEMP "mysql-$env:MYSQL_VERSION-winx64.zip"
          $mysqlUrl = "https://cdn.mysql.com/Downloads/MySQL-8.4/mysql-$env:MYSQL_VERSION-winx64.zip"
          & curl.exe -L --fail --retry 5 --retry-delay 3 --connect-timeout 30 -o $mysqlZip $mysqlUrl
          if ($LASTEXITCODE -ne 0) { throw "MySQL download failed" }
          $mysqlExtract = Join-Path $env:RUNNER_TEMP 'mysql-251-extracted'
          if (Test-Path $mysqlExtract) { Remove-Item $mysqlExtract -Recurse -Force }
          Expand-Archive -LiteralPath $mysqlZip -DestinationPath $mysqlExtract -Force
          $mysqlRoot = Get-ChildItem $mysqlExtract -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'bin\mysqld.exe') } | Select-Object -First 1
          if (!$mysqlRoot) { throw "mysqld.exe not found" }
          Copy-Item "$($mysqlRoot.FullName)\*" "$stage\mysql" -Recurse -Force

          # Package Microsoft's small Evergreen WebView2 bootstrapper.
          $webview = Join-Path $stage 'MicrosoftEdgeWebview2Setup.exe'
          & curl.exe -L --fail --retry 5 --retry-delay 3 -o $webview 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
          if ($LASTEXITCODE -ne 0) { throw "WebView2 bootstrapper download failed" }

          "STAGE_DIR=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate installer script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $iss = Join-Path $env:RUNNER_TEMP 'qimutang-251.iss'
          $output = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $stage = $env:STAGE_DIR

          $content = @"
          [Setup]
          AppId=QimutangStoreSystem251Desktop
          AppName=齐沐堂门店管理系统
          AppVersion=$env:APP_VERSION
          AppPublisher=齐沐堂
          AppPublisherURL=https://github.com/airuike8868/Qimutang-Store-System
          DefaultDirName={localappdata}\Programs\QimutangStore
          DefaultGroupName=齐沐堂门店管理系统
          DisableProgramGroupPage=yes
          OutputDir=$output
          OutputBaseFilename=Qimutang-2.5.1-Windows-Desktop-Installer
          SetupIconFile=$stage\qimutang.ico
          UninstallDisplayIcon={app}\qimutang.ico
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          WizardStyle=modern
          CloseApplications=yes
          UninstallDisplayName=齐沐堂门店管理系统 2.5.1

          [Files]
          Source: "$stage\app\*"; DestDir: "{app}\app"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\runtime\*"; DestDir: "{app}\runtime"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\client\*"; DestDir: "{app}\client"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\mysql\*"; DestDir: "{app}\mysql"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\qimutang.ico"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$stage\MicrosoftEdgeWebview2Setup.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Icons]
          Name: "{autoprograms}\齐沐堂门店管理系统"; Filename: "{app}\client\QimutangDesktop.exe"; WorkingDir: "{app}"; IconFilename: "{app}\qimutang.ico"
          Name: "{userdesktop}\齐沐堂门店管理系统"; Filename: "{app}\client\QimutangDesktop.exe"; WorkingDir: "{app}"; IconFilename: "{app}\qimutang.ico"

          [Run]
          Filename: "{tmp}\MicrosoftEdgeWebview2Setup.exe"; Parameters: "/silent /install"; StatusMsg: "正在准备桌面运行环境..."; Flags: waituntilterminated skipifdoesntexist
          Filename: "{app}\client\QimutangDesktop.exe"; Description: "启动齐沐堂门店管理系统"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          "@

          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($iss,$content,$utf8Bom)
          "ISS_FILE=$iss" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build EXE installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc $env:ISS_FILE
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Verify installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem dist -Filter '*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (!$exe) { throw "Installer EXE missing" }
          if ($exe.Length -lt 50MB) { throw "Installer unexpectedly small" }
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($exe.Name)" | Set-Content 'dist\SHA256SUMS.txt' -Encoding ASCII
          Write-Host "DESKTOP INSTALLER SUCCESS: $($exe.FullName)"
          Write-Host "SIZE: $($exe.Length)"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: Qimutang-2.5.1-Windows-Desktop-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
