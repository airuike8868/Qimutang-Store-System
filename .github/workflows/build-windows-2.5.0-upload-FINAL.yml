name: Build Qimutang 2.5.0 MySQL Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      APP_VERSION: "2.5.0"
      MYSQL_VERSION: "8.4.11"
      SOURCE_ZIP: "齐沐堂2.5.0-GitHub构建上传包.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract and locate Maven project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path -LiteralPath $env:SOURCE_ZIP)) {
            Write-Host "Repository root files:"
            Get-ChildItem -Force | Format-Table Name, Length
            throw "Source ZIP not found: $env:SOURCE_ZIP"
          }

          $work = Join-Path $env:RUNNER_TEMP "qimutang-source"

          if (Test-Path $work) {
            Remove-Item $work -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $work | Out-Null

          Expand-Archive `
            -LiteralPath $env:SOURCE_ZIP `
            -DestinationPath $work `
            -Force

          for ($round = 1; $round -le 4; $round++) {
            $pom = Get-ChildItem `
              -Path $work `
              -Filter pom.xml `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($pom) {
              break
            }

            $nestedZips = Get-ChildItem `
              -Path $work `
              -Filter *.zip `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if (!$nestedZips) {
              break
            }

            foreach ($zip in $nestedZips) {
              $dest = Join-Path `
                $zip.Directory.FullName `
                ("expanded-" + $zip.BaseName)

              if (!(Test-Path $dest)) {
                New-Item -ItemType Directory -Force -Path $dest | Out-Null

                try {
                  Expand-Archive `
                    -LiteralPath $zip.FullName `
                    -DestinationPath $dest `
                    -Force
                }
                catch {
                  Write-Warning "Cannot extract nested ZIP: $($zip.FullName)"
                }
              }
            }
          }

          $pom = Get-ChildItem `
            -Path $work `
            -Filter pom.xml `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$pom) {
            Write-Host "Extracted files:"
            Get-ChildItem $work -Recurse |
              Select-Object FullName |
              Format-Table -AutoSize

            throw "pom.xml not found anywhere inside source package"
          }

          $projectDir = $pom.Directory.FullName

          Write-Host "Maven project found:"
          Write-Host $projectDir

          "PROJECT_DIR=$projectDir" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Patch DbCompat for Java 17
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dbCompat = Get-ChildItem `
            -Path $env:PROJECT_DIR `
            -Filter DbCompat.java `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$dbCompat) {
            Write-Host "DbCompat.java not found - no patch required"
            exit 0
          }

          Write-Host "Patching:"
          Write-Host $dbCompat.FullName

          $text = [System.IO.File]::ReadAllText($dbCompat.FullName)

          # Remove existing BOM if present.
          if ($text.Length -gt 0 -and [int][char]$text[0] -eq 0xFEFF) {
            $text = $text.Substring(1)
          }

          if ($text -notmatch 'import org\.springframework\.jdbc\.core\.ConnectionCallback;') {
            if ($text -match 'import org\.springframework\.jdbc\.core\.JdbcTemplate;') {
              $text = $text -replace `
                'import org\.springframework\.jdbc\.core\.JdbcTemplate;', `
                "import org.springframework.jdbc.core.JdbcTemplate;`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
            }
            else {
              $text = $text -replace `
                '(package\s+[^;]+;)', `
                "`$1`r`n`r`nimport org.springframework.jdbc.core.ConnectionCallback;"
            }
          }

          $text = $text -replace `
            'db\.execute\(connection\s*->', `
            'db.execute((ConnectionCallback<Boolean>) connection ->'

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllText(
            $dbCompat.FullName,
            $text,
            $utf8NoBom
          )

          Write-Host "DbCompat.java patched as UTF-8 without BOM"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Qimutang 2.5.0
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          mvn --batch-mode clean package -DskipTests

          if ($LASTEXITCODE -ne 0) {
            throw "Maven build failed"
          }

          Write-Host "Generated target files:"
          Get-ChildItem target -File |
            Format-Table Name, Length

          $jar = Get-ChildItem `
            target `
            -Filter *.jar `
            -File |
            Where-Object {
              $_.Name -notlike "original-*"
            } |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (!$jar) {
            throw "No JAR generated"
          }

          if ($jar.Name -ne "qimutang.jar") {
            Copy-Item `
              $jar.FullName `
              "target\qimutang.jar" `
              -Force
          }

          if (!(Test-Path "target\qimutang.jar")) {
            throw "Normalized qimutang.jar missing"
          }

          Write-Host "Normalized JAR ready: target\qimutang.jar"

      - name: Verify MySQL Connector
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Location $env:PROJECT_DIR

          $entries = & jar tf "target\qimutang.jar"

          $mysql = $entries |
            Select-String "BOOT-INF/lib/mysql-connector"

          if ($mysql) {
            Write-Host "[OK] MySQL Connector found"
            $mysql
          }
          else {
            Write-Warning "MySQL Connector not detected by filename"
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Prepare Windows payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $stage = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang-stage"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path `
              "$stage\app",
              "$stage\runtime",
              "$stage\scripts" |
            Out-Null

          Copy-Item `
            "$env:PROJECT_DIR\target\qimutang.jar" `
            "$stage\app\qimutang.jar" `
            -Force

          Copy-Item `
            "$env:JAVA_HOME\*" `
            "$stage\runtime" `
            -Recurse `
            -Force

          $startFile = Join-Path `
            $env:PROJECT_DIR `
            "start-qimutang.cmd"

          if (Test-Path $startFile) {
            Copy-Item `
              $startFile `
              "$stage\start-qimutang.cmd" `
              -Force
          }
          else {
            @'
          @echo off
          setlocal
          cd /d "%~dp0"
          "%~dp0runtime\bin\java.exe" -jar "%~dp0app\qimutang.jar"
          '@ |
            Set-Content `
              "$stage\start-qimutang.cmd" `
              -Encoding ASCII
          }

          $scripts = Join-Path `
            $env:PROJECT_DIR `
            "scripts"

          if (Test-Path $scripts) {
            Copy-Item `
              "$scripts\*" `
              "$stage\scripts" `
              -Recurse `
              -Force
          }

          $mysqlZip = Join-Path `
            $env:RUNNER_TEMP `
            "mysql-$env:MYSQL_VERSION-winx64.zip"

          $mysqlUrl = `
            "https://dev.mysql.com/get/Downloads/MySQL-8.4/mysql-$env:MYSQL_VERSION-winx64.zip"

          Write-Host "Downloading MySQL:"
          Write-Host $mysqlUrl

          Invoke-WebRequest `
            -Uri $mysqlUrl `
            -OutFile $mysqlZip `
            -UseBasicParsing

          $mysqlExtract = Join-Path `
            $env:RUNNER_TEMP `
            "mysql-extracted"

          if (Test-Path $mysqlExtract) {
            Remove-Item `
              $mysqlExtract `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -LiteralPath $mysqlZip `
            -DestinationPath $mysqlExtract `
            -Force

          $mysqlRoot = Get-ChildItem `
            $mysqlExtract `
            -Directory |
            Select-Object -First 1

          if (
            !$mysqlRoot -or
            !(Test-Path "$($mysqlRoot.FullName)\bin\mysqld.exe")
          ) {
            throw "MySQL extraction failed"
          }

          Copy-Item `
            $mysqlRoot.FullName `
            "$stage\mysql" `
            -Recurse `
            -Force

          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "$stage\vc_redist.x64.exe" `
            -UseBasicParsing

          "STAGE_DIR=$stage" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Generate installer script
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iss = Join-Path `
            $env:RUNNER_TEMP `
            "qimutang.iss"

          $output = Join-Path `
            $env:GITHUB_WORKSPACE `
            "dist"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $output |
            Out-Null

          $stage = $env:STAGE_DIR

          $content = @"
          [Setup]
          AppId={{E7A30D65-8F42-4B43-98D6-250025025000}
          AppName=齐沐堂门店管理系统
          AppVersion=$env:APP_VERSION
          AppPublisher=齐沐堂
          DefaultDirName={localappdata}\Programs\QimutangStore
          DefaultGroupName=齐沐堂
          OutputDir=$output
          OutputBaseFilename=齐沐堂门店管理系统-$env:APP_VERSION-Windows安装版
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=modern
          CloseApplications=yes

          [Files]
          Source: "$stage\app\*"; DestDir: "{app}\app"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\runtime\*"; DestDir: "{app}\runtime"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\mysql\*"; DestDir: "{app}\mysql"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\scripts\*"; DestDir: "{app}\scripts"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$stage\start-qimutang.cmd"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$stage\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Dirs]
          Name: "{userprofile}\QimutangData"
          Name: "{userprofile}\QimutangData\config"
          Name: "{userprofile}\QimutangData\data"
          Name: "{userprofile}\QimutangData\logs"
          Name: "{userprofile}\QimutangData\backup"

          [Icons]
          Name: "{autodesktop}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"
          Name: "{group}\齐沐堂门店管理系统"; Filename: "{app}\start-qimutang.cmd"; WorkingDir: "{app}"

          [Run]
          Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; Flags: waituntilterminated
          Filename: "{app}\start-qimutang.cmd"; Description: "启动齐沐堂门店管理系统"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          "@

          Set-Content `
            -LiteralPath $iss `
            -Value $content `
            -Encoding UTF8

          "ISS_PATH=$iss" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Build EXE installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = `
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            $iscc = `
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }

          & $iscc $env:ISS_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed"
          }

      - name: Verify installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem `
            dist `
            -Filter *.exe `
            -File |
            Select-Object -First 1

          if (!$exe) {
            throw "Installer EXE was not generated"
          }

          $hash = Get-FileHash `
            $exe.FullName `
            -Algorithm SHA256

          "$($hash.Hash.ToLower())  $($exe.Name)" |
            Set-Content `
              "dist\SHA256SUMS.txt" `
              -Encoding ASCII

          Write-Host "Installer:"
          Write-Host $exe.FullName

          Write-Host "Size:"
          Write-Host $exe.Length

          Write-Host "SHA256:"
          Write-Host $hash.Hash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Qimutang-2.5.0-Windows-Installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
