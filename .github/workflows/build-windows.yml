name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: powershell
        run: Expand-Archive -Path source.zip -DestinationPath source -Force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: source/pom.xml
      - name: Install WiX
        shell: powershell
        run: choco install wixtoolset --no-progress -y
      - name: Build installer
        shell: cmd
        working-directory: source
        run: build-windows-exe.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Qimutang-Windows-Installer
          path: source/dist/*.exe
          if-no-files-found: error
