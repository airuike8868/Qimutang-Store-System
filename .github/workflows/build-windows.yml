name: Build Windows Portable

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: powershell
        run: Expand-Archive -Path source-ui-2.1.1.zip -DestinationPath source -Force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: source/pom.xml
      - name: Build application
        shell: powershell
        working-directory: source
        run: mvn clean package
      - name: Build portable Windows application
        shell: powershell
        working-directory: source
        run: |
          jpackage --type app-image --name "Qimutang-Store-System" --app-version 2.1.1 --vendor "Qimutang" --description "Qimutang local store management system" --input target --main-jar qimutang.jar --dest portable --java-options "-Dfile.encoding=UTF-8"
          Compress-Archive -Path "portable\Qimutang-Store-System" -DestinationPath "Qimutang-Store-System-2.1.1-Portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Qimutang-Windows-Portable-2.1.1
          path: source/Qimutang-Store-System-2.1.1-Portable.zip
          if-no-files-found: error
