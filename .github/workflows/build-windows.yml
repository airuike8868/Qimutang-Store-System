name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: powershell
        run: Expand-Archive -Path source.zip -DestinationPath source -Force
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: source/pom.xml
      - name: Install WiX
        shell: powershell
        run: choco install wixtoolset --no-progress -y
      - name: Build application
        shell: powershell
        working-directory: source
        run: mvn clean package
      - name: Build Windows installer
        shell: powershell
        working-directory: source
        run: |
          jpackage --type exe --name "Qimutang-Store-System" --app-version 2.0.0 --vendor "Qimutang" --description "Qimutang local store management system" --input target --main-jar qimutang.jar --dest dist --java-options "-Dfile.encoding=UTF-8" --win-shortcut --win-menu --win-dir-chooser --win-per-user-install
      - uses: actions/upload-artifact@v4
        with:
          name: Qimutang-Windows-Installer
          path: source/dist/*.exe
          if-no-files-found: error
